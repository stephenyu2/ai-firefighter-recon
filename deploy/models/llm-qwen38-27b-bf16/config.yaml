model_name: recon-qwen38-27b-bf16
description: "Qwen3.8-27B, bf16 weights from Qwen/Qwen3.8-27B, on one RTX PRO 6000. vLLM, OpenAI-compatible, tool calling and log-probs."
model_metadata:
  example_model_input:
    model: Qwen/Qwen3.8-27B
    messages:
      - role: user
        content: "Reply with one word: ready"
    max_tokens: 8
    chat_template_kwargs:
      enable_thinking: false
  tags:
    - openai-compatible
base_image:
  image: vllm/vllm-openai:v0.31.0
weights:
  - source: "hf://Qwen/Qwen3.8-27B@1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
    mount_location: "/models/qwen38"
docker_server:
  start_command: >-
    vllm serve /models/qwen38
    --served-model-name Qwen/Qwen3.8-27B
    --host 0.0.0.0
    --port 8000
    --max-model-len 32768
    --gpu-memory-utilization 0.90
    --limit-mm-per-prompt '{"image": 6}'
    --enable-auto-tool-choice
    --tool-call-parser qwen3_coder
    --reasoning-parser qwen3
    --max-logprobs 20
    --enable-prefix-caching
    --max-num-seqs 256
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
resources:
  accelerator: RTX_PRO_6000
  use_gpu: true
runtime:
  predict_concurrency: 32
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 600
    stop_traffic_threshold_seconds: 300
