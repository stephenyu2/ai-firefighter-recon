model_name: recon-qwen3vl-4b
model_metadata:
  example_model_input:
    model: Qwen/Qwen3-VL-4B-Instruct
    messages:
      - role: user
        content: "Reply with one word: ready"
    max_tokens: 8
  tags:
    - openai-compatible
base_image:
  image: vllm/vllm-openai:v0.31.0
weights:
  - source: "hf://Qwen/Qwen3-VL-4B-Instruct@ebb281ec70b05090aa6165b016eac8ec08e71b17"
    mount_location: "/models/qwen3vl"
docker_server:
  start_command: >-
    vllm serve /models/qwen3vl
    --served-model-name Qwen/Qwen3-VL-4B-Instruct
    --host 0.0.0.0
    --port 8000
    --max-model-len 16384
    --gpu-memory-utilization 0.90
    --limit-mm-per-prompt '{"image": 6}'
    --enable-auto-tool-choice
    --tool-call-parser hermes
    --max-logprobs 20
    --enable-prefix-caching
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
resources:
  accelerator: L4
  use_gpu: true
runtime:
  predict_concurrency: 16
  health_checks:
    startup_threshold_seconds: 900
    restart_threshold_seconds: 300
    stop_traffic_threshold_seconds: 120
