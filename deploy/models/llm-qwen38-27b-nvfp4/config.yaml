model_name: recon-qwen38-27b-nvfp4
description: "Qwen3.8-27B, nvfp4 weights from Inferact/Qwen3.8-27B-NVFP4, on one RTX PRO 6000. vLLM, OpenAI-compatible, tool calling and log-probs."
model_metadata:
  example_model_input:
    model: Qwen/Qwen3.8-27B
    messages:
      - role: user
        content: "Reply with one word: ready"
    max_tokens: 8
    chat_template_kwargs:
      enable_thinking: false
  tags:
    - openai-compatible
base_image:
  image: vllm/vllm-openai:v0.31.0
weights:
  - source: "hf://Inferact/Qwen3.8-27B-NVFP4@6128240ebaf4eaa7bad2b3d1c72c37d677c5f462"
    mount_location: "/models/qwen38"
docker_server:
  start_command: >-
    vllm serve /models/qwen38
    --served-model-name Qwen/Qwen3.8-27B
    --host 0.0.0.0
    --port 8000
    --max-model-len 32768
    --gpu-memory-utilization 0.90
    --limit-mm-per-prompt '{"image": 6}'
    --enable-auto-tool-choice
    --tool-call-parser qwen3_coder
    --reasoning-parser qwen3
    --max-logprobs 20
    --enable-prefix-caching
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
resources:
  accelerator: RTX_PRO_6000
  use_gpu: true
runtime:
  predict_concurrency: 32
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 600
    stop_traffic_threshold_seconds: 300
