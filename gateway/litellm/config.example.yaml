# LiteLLM gateway for the recon pipeline: one OpenAI-compatible endpoint and one key for every model the gateway calls.
# Copy to config.yaml and point each api_base / target at wherever that model runs. The local ports below are only an
# example layout (one server per model). Upstream keys stay in the environment, never in this file.
model_list:
  - model_name: qwen38-27b-bf16
    litellm_params:
      model: openai/Qwen/Qwen3.8-27B
      api_base: http://127.0.0.1:8001/v1
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 600
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: qwen38-27b-fp8
    litellm_params:
      model: openai/Qwen/Qwen3.8-27B
      api_base: http://127.0.0.1:8002/v1
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 600
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: qwen38-27b-int4
    litellm_params:
      model: openai/Qwen/Qwen3.8-27B
      api_base: http://127.0.0.1:8003/v1
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 600
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: qwen38-27b-nvfp4
    litellm_params:
      model: openai/Qwen/Qwen3.8-27B
      api_base: http://127.0.0.1:8004/v1
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 600
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: qwen3vl-4b
    litellm_params:
      model: openai/Qwen/Qwen3-VL-4B-Instruct
      api_base: http://127.0.0.1:8005/v1
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 600

litellm_settings:
  drop_params: false  # an unsupported parameter is an error, never a silent drop
  callbacks: custom_callbacks.request_log

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Non-chat models go through pass-through routes, so every call in a brief crosses the same gateway.
  # The last path segment names the route in logs/requests.jsonl (custom_callbacks.py reads this list).
  pass_through_endpoints:
    - path: /recon/classifier
      target: http://127.0.0.1:8010/predict
      headers:
        Authorization: Bearer os.environ/UPSTREAM_API_KEY
        content-type: application/json
    - path: /recon/kai
      target: http://127.0.0.1:8011/predict
      headers:
        Authorization: Bearer os.environ/UPSTREAM_API_KEY
        content-type: application/json
    - path: /recon/clef
      target: http://127.0.0.1:8012/predict
      headers:
        Authorization: Bearer os.environ/UPSTREAM_API_KEY
        content-type: application/json
    - path: /recon/clef-flash
      target: http://127.0.0.1:8013/predict
      headers:
        Authorization: Bearer os.environ/UPSTREAM_API_KEY
        content-type: application/json
